<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Spilr</title>
<!--
  Custom action URL for Firebase Auth emails (Console → Authentication →
  Templates → Customize action URL = https://spilr-100f7.web.app/auth/action).

  With the app installed, iOS opens the app for this URL (the domain's
  auto-served apple-app-site-association claims /*) and the app applies the
  code itself. This page only runs when the link opens in a browser.

  verifyEmail is handled here. Every other mode (resetPassword, recoverEmail,
  …) is forwarded to Firebase's default handler, since the custom action URL
  applies to all templates.
-->
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #FBF3EA;
    color: #2B1B10;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  main {
    max-width: 480px;
    padding: 24px 16px;
    text-align: center;
  }
  h1 {
    font-size: 2.5rem;
    font-style: italic;
    margin-bottom: 8px;
  }
  h2 {
    font-size: 1.3rem;
    font-weight: 600;
    margin: 24px 0 8px;
  }
  p {
    color: #8A7A6E;
    line-height: 1.6;
  }
  a.button {
    display: none;
    margin-top: 20px;
    padding: 12px 28px;
    background: #C1592E;
    color: #FFF8F2;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <h1>spilr.</h1>
  <h2 id="title">Verifying your email…</h2>
  <p id="detail"></p>
  <!-- A link to this same domain (spilr-100f7.web.app) does not open the app —
       iOS only treats a tap on a universal link as one when it's opened from
       OUTSIDE that domain, e.g. from Mail. A custom scheme always opens it. -->
  <a class="button" id="openApp" href="spilr://verified">Open Spilr</a>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var mode = params.get("mode");

    if (mode !== "verifyEmail") {
      location.replace("https://spilr-100f7.firebaseapp.com/__/auth/action" + location.search);
      return;
    }

    var title = document.getElementById("title");
    var detail = document.getElementById("detail");
    var openApp = document.getElementById("openApp");
    function show(t, d, showButton) {
      title.textContent = t;
      detail.textContent = d;
      if (showButton) openApp.style.display = "inline-block";
    }

    var code = params.get("oobCode");
    var key = params.get("apiKey");
    if (!code || !key) {
      show("This link is incomplete", "Open the Spilr app and tap Resend email for a fresh link.", true);
      return;
    }

    fetch("https://identitytoolkit.googleapis.com/v1/accounts:update?key=" + encodeURIComponent(key), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ oobCode: code })
    })
      .then(function (res) {
        if (res.ok) {
          show("Email verified", "You're all set. Tap below to go back to the Spilr app.", true);
        } else {
          // The code may be stale rather than the address unverified — a resend
          // issues a fresh oobCode but the address could already be confirmed.
          // The app re-checks on open, so the button still applies here.
          show("This link has expired", "It may already have been used. Open the app below — if it still asks you to verify, tap Resend email.", true);
        }
      })
      .catch(function () {
        show("Couldn't reach the server", "Check your connection and open the link again.");
      });
  })();
</script>
</body>
</html>
